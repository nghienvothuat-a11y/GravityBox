<svg xmlns="http://www.w3.org/2000/svg" width="880" height="696" viewBox="0 0 880 696"><rect width="880" height="696" fill="#f6f7f0"/><style>text{font-family:Arial,sans-serif;fill:#304953} .step{font-size:17px}</style><text x="28" y="34" font-size="23">20 · BOSS · Hai nửa một máy</text><text x="28" y="61" font-size="14">Sơ đồ mốc lời giải dành cho người dựng · không phải hướng dẫn trong game</text><rect x="28" y="80" width="824" height="82" rx="12" fill="white" stroke="#a5b7b8"/><circle cx="55" cy="108" r="16" fill="#d6e6e5"/><text x="50" y="114" font-size="16">1</text><text x="85" y="108" class="step">Tách 50/50; một phần giữ A để mở ống lên ban công phải</text><path d="M440 165v15" stroke="#699491" stroke-width="3"/><rect x="28" y="180" width="824" height="82" rx="12" fill="white" stroke="#a5b7b8"/><circle cx="55" cy="208" r="16" fill="#d6e6e5"/><text x="50" y="214" font-size="16">2</text><text x="85" y="208" class="step">Phần kia chui ống, kéo B: cầu tầng giữa vào chốt và đường về mở</text><path d="M440 265v15" stroke="#699491" stroke-width="3"/><rect x="28" y="280" width="824" height="82" rx="12" fill="white" stroke="#a5b7b8"/><circle cx="55" cy="308" r="16" fill="#d6e6e5"/><text x="50" y="314" font-size="16">3</text><text x="85" y="308" class="step">Phần A rời nút, dùng cầu đến sàn hội tụ</text><path d="M440 365v15" stroke="#699491" stroke-width="3"/><rect x="28" y="380" width="824" height="82" rx="12" fill="white" stroke="#a5b7b8"/><circle cx="55" cy="408" r="16" fill="#d6e6e5"/><text x="50" y="414" font-size="16">4</text><text x="85" y="408" class="step">Hợp thể 100%; đẩy thùng làm bậc tới tời</text><path d="M440 465v15" stroke="#699491" stroke-width="3"/><rect x="28" y="480" width="824" height="82" rx="12" fill="white" stroke="#a5b7b8"/><circle cx="55" cy="508" r="16" fill="#d6e6e5"/><text x="50" y="514" font-size="16">5</text><text x="85" y="508" class="step">Kéo tời bằng bản thể đầy đủ, nâng nhịp cầu cuối</text><path d="M440 565v15" stroke="#699491" stroke-width="3"/><rect x="28" y="580" width="824" height="82" rx="12" fill="white" stroke="#a5b7b8"/><circle cx="55" cy="608" r="16" fill="#d6e6e5"/><text x="50" y="614" font-size="16">6</text><text x="85" y="608" class="step">Leo lên và toàn thân thoát</text></svg>